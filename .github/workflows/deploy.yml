name: AWS SQS Demo Infrastructure Deployment

on:
  push:
    branches:
      - feature/* # Triggers the deployment whenever you push to this branch

permissions:
  id-token: write # MANDATORY for OIDC authentication
  contents: read  # Allows GitHub to check out your repository code

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code into the runner workspace
      - name: Checkout Code
        uses: actions/checkout@v4

      # Debug: shows the role being assumed and the OIDC claims AWS will compare against the trust policy
      - name: Debug OIDC Role and Token Claims
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN secret is empty or not visible to this workflow"
            exit 1
          fi
          if [[ "$ROLE_ARN" =~ [[:space:]] ]]; then
            echo "::error::AWS_ROLE_ARN contains spaces or a newline. Re-save the secret without them."
          fi
          if [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "Role ARN format: OK"
          else
            echo "::error::AWS_ROLE_ARN is not in the form arn:aws:iam::<12-digit-account>:role/<name>"
          fi
          echo "Account ID : $(echo "$ROLE_ARN" | cut -d: -f5)"
          echo "Role name  : ${ROLE_ARN##*/}"

          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          PAYLOAD=$(echo "$RESPONSE" | jq -r '.value' | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "OIDC token claims (the trust policy must match iss, aud and sub):"
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, ref, environment, job_workflow_ref}'

      # 2. Authenticate securely with AWS using your IAM OIDC Role
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # Fetches the Role ARN you saved in GitHub Secrets
          aws-region: us-east-1

      # 3. Setup the Terraform CLI binary on the runner environment
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # 4. Initialize Terraform and download the required AWS/Archive providers
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      # 5. Validate the syntactical correctness of your code configuration blocks
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # 6. Preview every change and save it as a binary plan file
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      # 7. Hand the exact plan, the Lambda zip it references, and the provider lock file to the apply job
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          include-hidden-files: true
          retention-days: 1
          path: |
            terraform/tfplan
            terraform/lambda_codes.zip
            terraform/.terraform.lock.hcl

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production # Add required reviewers to this environment so apply waits for approval

    steps:
      # 1. Checkout the repository code into the runner workspace
      - name: Checkout Code
        uses: actions/checkout@v4

      # Debug: the apply job runs in the production environment, so its sub claim differs from the plan job
      - name: Debug OIDC Role and Token Claims
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN secret is empty or not visible to this workflow"
            exit 1
          fi
          echo "Account ID : $(echo "$ROLE_ARN" | cut -d: -f5)"
          echo "Role name  : ${ROLE_ARN##*/}"
          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          PAYLOAD=$(echo "$RESPONSE" | jq -r '.value' | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "OIDC token claims (the trust policy must match iss, aud and sub):"
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, repository, ref, environment, job_workflow_ref}'

      # 2. Authenticate securely with AWS using your IAM OIDC Role
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 3. Setup the Terraform CLI binary on the runner environment
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # 4. Restore the reviewed plan produced by the plan job
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      # 5. Re-initialize with the same provider versions the plan was built with
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      # 6. Apply exactly the approved plan, nothing more
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false tfplan
